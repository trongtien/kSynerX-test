services:
  db:
    image: postgres:18-alpine
    container_name: cdms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cdms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cdms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  loadtest:
    build: { context: ., dockerfile: loadtest/Dockerfile }
    environment:
      INITIAL_PRODUCTS: 250
    ports: ["4000:4000"]
    restart: unless-stopped

  cdms:
    build: { context: ., dockerfile: cdms/Dockerfile }
    ports: ["3000:3000"]
    env_file:
      - .env.example
    environment:
      SERVICE_HOST: 0.0.0.0
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      SERVICE_TEST_HOST: loadtest
      SERVICE_TEST_PORT: 4000
    depends_on:
      db: { condition: service_healthy }
      loadtest: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
