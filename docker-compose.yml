version: "3.8"

services:
  db:
    image: postgres:18-alpine
    container_name: cdms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cdms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cdms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  loadtest:
    build: { context: ., dockerfile: loadtest/Dockerfile }
    environment: { INITIAL_PRODUCTS: 250 }
    ports: ["4000:4000"]
    env_file:
      - .env.example
    restart: unless-stopped

  cdms:
    build: { context: ., dockerfile: cdms/Dockerfile }
    ports: ["3000:3000"]
    env_file:
      - .env.example
    depends_on:
      db: { condition: service_healthy }
      loadtest: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
